<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aashwat Singh</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root { --bg: #f7f5f2; --text: #1d1b18; --muted: #6b655c; --accent: #c2410c; --card: #fff; --border: #e4dfd7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141312; --text: #efebe5; --muted: #a39c91; --accent: #f97316; --card: #1d1c1a; --border: #36322e; }
    }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; }
    a.card:hover { border-color: var(--accent); }
    a.card strong { display: block; }
    a.card span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Aashwat Singh</h1>
    <a class="card" href="hamza/">
      <strong>Hamza Lessons →</strong>
      <span>Track every lesson from the @Hamza97 YouTube channel.</span>
    </a>
  </main>
</body>
</html>
