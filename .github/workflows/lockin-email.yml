name: Lock In email

# A by-hand backup sender. The daily emails come from the Lock In scheduled tasks in Claude
# (see the README), because GitHub started this workflow's own schedule 3.5 to 6 hours late.
# Sending from here needs the LOCKIN_GMAIL_ADDRESS and LOCKIN_GMAIL_APP_PASSWORD repository
# secrets.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Which email to send now
        type: choice
        options:
          - morning
          - night
        default: morning

permissions:
  contents: read

concurrency:
  group: lockin-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Write the email
        env:
          SLOT: ${{ inputs.slot }}
        run: node scripts/lockin_email.mjs > "$RUNNER_TEMP/email.json"

      - name: Send it
        env:
          LOCKIN_GMAIL_ADDRESS: ${{ secrets.LOCKIN_GMAIL_ADDRESS }}
          LOCKIN_GMAIL_APP_PASSWORD: ${{ secrets.LOCKIN_GMAIL_APP_PASSWORD }}
          LOCKIN_EMAIL_TO: ${{ secrets.LOCKIN_EMAIL_TO }}
        run: python3 scripts/send_email.py "$RUNNER_TEMP/email.json"
